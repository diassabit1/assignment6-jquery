<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="selectors.html">Selectors</a>
        <a href="effects.html">Effects</a>
        <a href="dom.html">DOM</a>
        <a href="animations.html">Animations</a>
        <a href="project.html">Mini Project</a>
    </nav>

    <main class="container">
        <h1>jQuery Effects</h1>

        <section>
            <h2>Task 2 - Visibility</h2>
            <p id="hideText">This paragraph can be hidden or shown.</p>
            <button id="hideButton">Hide</button>
            <button id="showButton">Show</button>
            <button id="toggleButton">Toggle</button>
        </section>

        <section>
            <h2>Task 3 - Fade</h2>
            <img id="fadeImage" src="https://picsum.photos/id/237/320/200" alt="Dog">
            <div>
                <button id="fadeOutButton">Fade Out</button>
                <button id="fadeInButton">Fade In</button>
                <button id="fadeToggleButton">Fade Toggle</button>
            </div>
        </section>

        <section>
            <h2>Task 4 - Slide</h2>
            <div id="slidePanel">
                <p>This is a sliding panel.</p>
                <p>jQuery makes it easy to create slide effects.</p>
            </div>
            <button id="slideUpButton">Slide Up</button>
            <button id="slideDownButton">Slide Down</button>
            <button id="slideToggleButton">Slide Toggle</button>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
