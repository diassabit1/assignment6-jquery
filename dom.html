<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="selectors.html">Selectors</a>
        <a href="effects.html">Effects</a>
        <a href="dom.html">DOM</a>
        <a href="animations.html">Animations</a>
        <a href="project.html">Mini Project</a>
    </nav>

    <main class="container">
        <h1>DOM Manipulation</h1>

        <section>
            <h2>Task 5 - Add and Remove Elements</h2>
            <ul id="itemList">
                <li>Item 1</li>
                <li>Item 2</li>
            </ul>
            <button id="addButton">Add Item</button>
            <button id="prependButton">Prepend Item</button>
            <button id="removeButton">Remove Item</button>
        </section>

        <section>
            <h2>Task 6 - Modify Attributes</h2>
            <img id="changeImage" src="https://picsum.photos/id/237/320/200" alt="Animal">
            <div>
                <button id="imageButton">Change Image</button>
            </div>

            <p>
                <a id="changeLink" href="https://www.wikipedia.org/" target="_blank" rel="noopener noreferrer">Visit Wikipedia</a>
            </p>
            <button id="linkButton">Change Link</button>
        </section>

        <section>
            <h2>Task 7 - Form Interaction</h2>
            <form id="userForm">
                <input type="text" id="nameInput" placeholder="Enter your name">
                <input type="email" id="emailInput" placeholder="Enter your email">
            </form>

            <h3>Live Preview</h3>
            <p>Name: <span id="nameResult"></span></p>
            <p>Email: <span id="emailResult"></span></p>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
